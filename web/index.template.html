<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fingertip Mr Snakes</title>
<style>
  :root {
    --bg: #0f1a14;
    --panel: #16261d;
    --ink: #f3ecd6;
    --muted: #9fb3a5;
    --hedge: #2f6b3d;
    --hedge-dark: #1f4a2a;
    --floor-a: #1a2b20;
    --floor-b: #1d3024;
    --snake: #e8d24a;
    --snake-dark: #b49c22;
    --apple: #e2483c;
    --gold: #f2b632;
    --danger: #ff5a4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; overflow: hidden; }
  .app { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto;
    height: 100%; gap: 0; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px;
    padding: 10px 18px; background: var(--panel); border-bottom: 2px solid #0a120d; }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: .5px; white-space: nowrap; }
  .logo span { color: var(--snake); }
  .stat { display: flex; flex-direction: column; line-height: 1.05; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  .iconbtn { background: #24382b; color: var(--ink); border: 0; border-radius: 10px;
    width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
  .iconbtn:hover { background: #2e4836; }
  main { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%{transform:translate(-6px,2px)} 40%{transform:translate(6px,-2px)}
    60%{transform:translate(-4px,1px)} 80%{transform:translate(4px,0)} }
  aside { width: 250px; background: var(--panel); border-left: 2px solid #0a120d; padding: 14px 16px; overflow: auto; }
  aside h2 { margin: 0 0 10px; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); }
  ol.hof { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  ol.hof li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 6px 4px;
    border-bottom: 1px solid #22362a; font-size: 14px; }
  ol.hof li .r { color: var(--muted); }
  ol.hof li .s { font-variant-numeric: tabular-nums; font-weight: 700; }
  ol.hof li .lv { grid-column: 2 / 4; color: var(--muted); font-size: 11px; margin-top: -3px; }
  ol.hof li.me { background: rgba(242,182,50,.14); border-radius: 8px; }
  .empty { color: var(--muted); font-size: 13px; }
  .mode { margin-top: 14px; font-size: 11px; color: var(--muted); }
  .help { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  kbd { background: #24382b; border-radius: 4px; padding: 0 5px; color: var(--ink); font-family: inherit; }
  .pad { grid-column: 1 / -1; display: none; justify-content: center; gap: 14px; padding: 10px 10px 18px; }
  .pad button { width: 74px; height: 64px; border-radius: 18px; border: 0; background: #24382b;
    color: var(--ink); font-size: 28px; touch-action: manipulation; }
  .pad button:active { background: var(--hedge); }
  .pad .turn { background: #31402a; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; }
  .card { pointer-events: auto; background: rgba(15,26,20,.92); border: 2px solid #2b4434; border-radius: 20px;
    padding: 26px 30px; text-align: center; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .card h1 { margin: 0 0 6px; font-size: 28px; }
  .card p { margin: 6px 0; color: var(--muted); }
  .card .big { font-size: 42px; font-weight: 800; color: var(--gold); margin: 8px 0; }
  .card input { width: 100%; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 12px;
    border: 2px solid #2b4434; background: #0f1a14; color: var(--ink); text-align: center; margin: 10px 0; }
  .card button.go { font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 14px;
    padding: 12px 22px; background: var(--snake); color: #1b1a0b; cursor: pointer; margin: 4px; }
  .card button.ghost { background: #24382b; color: var(--ink); }
  .toast { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: var(--gold);
    color: #1b1a0b; font-weight: 800; padding: 8px 16px; border-radius: 999px; opacity: 0;
    transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
  .hidden { display: none !important; }
  @media (max-width: 820px), (pointer: coarse) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    aside.open { display: block; position: absolute; right: 0; top: 62px; bottom: 0; z-index: 5; }
    .pad { display: flex; }
    header { gap: 12px; padding: 8px 12px; }
    .logo { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Fingertip <span>Mr Snakes</span></div>
    <div class="stat"><small>Level</small><b id="lvl">1</b></div>
    <div class="stat grow"><small id="lvlname">Garden Gate</small><b id="food">&nbsp;</b></div>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Lives</small><b id="lives">♥♥♥</b></div>
    <button class="iconbtn" id="soundBtn" title="Sound on/off">🔊</button>
    <button class="iconbtn" id="pauseBtn" title="Pause (Space)">⏸</button>
    <button class="iconbtn" id="hofBtn" title="Hall of fame">🏆</button>
  </header>
  <main id="stage">
    <canvas id="board"></canvas>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </main>
  <aside id="side">
    <h2>🏆 Hall of Fame</h2>
    <ol class="hof" id="hof"></ol>
    <div class="help">
      <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>WASD</kbd> steer<br>
      <kbd>Q</kbd> / <kbd>E</kbd> turn left / right<br>
      <kbd>Space</kbd> pause · swipe on touch screens<br>
      Eat every 🍎 to unlock the gate, then slither through it.
    </div>
    <div class="mode" id="mode"></div>
  </aside>
  <div class="pad" id="pad">
    <button class="turn" data-cmd="turn_left" aria-label="Turn left">⟲</button>
    <button data-cmd="left" aria-label="Left">◀</button>
    <button data-cmd="up" aria-label="Up">▲</button>
    <button data-cmd="down" aria-label="Down">▼</button>
    <button data-cmd="right" aria-label="Right">▶</button>
    <button class="turn" data-cmd="turn_right" aria-label="Turn right">⟳</button>
  </div>
</div>

<script>
"use strict";
/* Levels mirror levels.pl (regenerate with: python3 tools/make_web.py) */
const LEVELS = /*LEVELS*/;

/* ---------- local engine: a JavaScript mirror of snake_engine.pl ---------- */
const DELTA = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: "down", down: "up", left: "right", right: "left" };
const TURN_L = { up: "left", left: "down", down: "right", right: "up" };
const TURN_R = { left: "up", down: "left", right: "down", up: "right" };
const GROW_PER_FOOD = 1, START_LIVES = 3, START_LEN = 3;

const LV = LEVELS.map((L) => {
  const walls = new Set(); let start = null, exit = null; const food = [];
  L.rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "#") walls.add(x + "," + y);
    else if (c === "S") start = [x, y];
    else if (c === "E") exit = [x, y];
    else if (c === "o") food.push([x, y]);
  }));
  return { ...L, walls, start, exit, food, width: L.rows[0].length, height: L.rows.length };
});

const same = (a, b) => a[0] === b[0] && a[1] === b[1];

const Engine = {
  newGame() { return this.startLevel(1, 0, START_LIVES); },
  startLevel(n, score, lives) {
    const L = LV[n - 1], [dx, dy] = DELTA[L.dir];
    const snake = [];
    for (let i = 0; i < START_LEN; i++) snake.push([L.start[0] - dx * i, L.start[1] - dy * i]);
    return { level: n, snake, dir: L.dir, grow: 0, food: L.food.map((f) => f.slice()),
             score, lives, status: "playing", crash: null, ticks: 0 };
  },
  chooseDir(cur, cmd, len) {
    if (cmd === "turn_left") return TURN_L[cur];
    if (cmd === "turn_right") return TURN_R[cur];
    if (DELTA[cmd]) return (len > 1 && OPP[cur] === cmd) ? cur : cmd;
    return cur;
  },
  advance(snake, dir, blocked, w, h, grow) {
    const [x, y] = snake[0], [dx, dy] = DELTA[dir];
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= w || ny >= h || blocked(nx, ny)) return { crash: [x, y] };
    const kept = grow > 0 ? snake.slice() : snake.slice(0, -1);
    if (kept.some((p) => p[0] === nx && p[1] === ny)) return { crash: [x, y] };
    return { snake: [[nx, ny], ...kept] };
  },
  step(g, cmd) {
    if (g.status === "game_over" || g.status === "won") return { g, events: [] };
    if (g.status === "crashed") return { g: this.startLevel(g.level, g.score, g.lives), events: ["respawn"] };
    const L = LV[g.level - 1];
    const dir = this.chooseDir(g.dir, cmd, g.snake.length);
    const locked = g.food.length > 0;
    const blocked = (x, y) => L.walls.has(x + "," + y) || (locked && x === L.exit[0] && y === L.exit[1]);
    const r = this.advance(g.snake, dir, blocked, L.width, L.height, g.grow);
    const ticks = g.ticks + 1;
    if (r.crash) {
      const lives = g.lives - 1;
      if (lives <= 0) return { g: { ...g, dir, lives: 0, status: "game_over", crash: r.crash, ticks }, events: ["crash", "game_over"] };
      return { g: { ...g, dir, lives, status: "crashed", crash: r.crash, ticks }, events: ["crash"] };
    }
    const head = r.snake[0], grow0 = g.grow > 0 ? g.grow - 1 : 0;
    if (same(head, L.exit)) {
      const score = g.score + 100 * g.level + 5 * r.snake.length;
      if (g.level >= LV.length)
        return { g: { ...g, snake: r.snake, dir, grow: 0, food: [], score: score + 500 * g.lives, status: "won", ticks }, events: ["win"] };
      return { g: this.startLevel(g.level + 1, score, g.lives), events: ["level_up"] };
    }
    const fi = g.food.findIndex((f) => same(f, head));
    if (fi >= 0) {
      const food = g.food.filter((_, i) => i !== fi);
      return { g: { ...g, snake: r.snake, dir, grow: grow0 + GROW_PER_FOOD, food, score: g.score + 10 * g.level, ticks },
               events: food.length ? ["eat"] : ["eat", "exit_open"] };
    }
    return { g: { ...g, snake: r.snake, dir, grow: grow0, ticks }, events: [] };
  },
  view(g) {
    const L = LV[g.level - 1];
    return { level: g.level, levels: LV.length, name: L.name, speed: L.speed, width: L.width, height: L.height,
             grid: L.rows, snake: g.snake, food: g.food, dir: g.dir, score: g.score, lives: g.lives,
             status: g.status, crash: g.crash, exitOpen: g.food.length === 0, ticks: g.ticks };
  },
};

/* ---------- backend: Prolog server if present, otherwise the local engine ---------- */
const Backend = {
  mode: "local", id: null, g: null, submitted: false,
  async init() {
    try {
      const r = await fetch("api/hall", { cache: "no-store" });
      if (!r.ok) throw new Error("no server");
      const j = await r.json();
      if (!Array.isArray(j.entries)) throw new Error("bad reply");
      this.mode = "server";
      return j.entries;
    } catch (e) {
      this.mode = "local";
      return localHall();
    }
  },
  async post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.json();
  },
  async newGame() {
    this.submitted = false;
    if (this.mode === "server") {
      const r = await this.post("api/new", {});
      this.id = r.id;
      return r.state;
    }
    this.g = Engine.newGame();
    return Engine.view(this.g);
  },
  async step(cmd) {
    if (this.mode === "server") {
      const r = await this.post("api/step", { id: this.id, cmd });
      if (r.error) throw new Error(r.error);
      return r;
    }
    const r = Engine.step(this.g, cmd);
    this.g = r.g;
    return { state: Engine.view(r.g), events: r.events };
  },
  async submit(name) {
    if (this.submitted) return { rank: 0, entries: null };
    this.submitted = true;
    if (this.mode === "server") return this.post("api/hall", { id: this.id, name });
    return localAdd(name, this.g.score, this.g.level);
  },
};

function localHall() {
  try { return JSON.parse(localStorage.getItem("ftms_hof") || "[]"); } catch (e) { return memHall; }
}
let memHall = [];
function localAdd(name, score, level) {
  let list = localHall();
  const entry = { score, name: (name || "Anonymous").slice(0, 16), level, date: Math.floor(Date.now() / 1000), _new: true };
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  list = list.slice(0, 10);
  const rank = list.indexOf(entry) + 1;
  list.forEach((e, i) => { e.rank = i + 1; });
  const clean = list.map(({ _new, ...e }) => e);
  memHall = clean;
  try { localStorage.setItem("ftms_hof", JSON.stringify(clean)); } catch (e) { /* storage unavailable */ }
  return { rank, entries: clean };
}

/* ---------- UI state ---------- */
const $ = (id) => document.getElementById(id);
const canvas = $("board"), ctx = canvas.getContext("2d");
let view = null, prevSnake = null, lastTick = 0, cell = 24;
let running = false, paused = false, busy = false, timer = null;
let queue = [], particles = [], myRank = 0, sound = true;
let hallEntries = [];

/* ---------- sound ---------- */
let actx = null;
function beep(freq, dur, type = "square", vol = 0.06, slide = 0) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* no audio */ }
}
const SFX = {
  eat: () => { beep(660, 0.08); setTimeout(() => beep(990, 0.08), 60); },
  exit_open: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.08), i * 90)),
  crash: () => beep(220, 0.35, "sawtooth", 0.08, -160),
  level_up: () => [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.1, "triangle", 0.08), i * 70)),
  win: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.16, "triangle", 0.09), i * 120)),
  game_over: () => [330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.25, "square", 0.06), 350 + i * 200)),
};

/* ---------- layout ---------- */
function resize() {
  if (!view) return;
  const stage = $("stage"), pad = 20;
  const w = stage.clientWidth - pad, h = stage.clientHeight - pad;
  cell = Math.max(8, Math.floor(Math.min(w / view.width, h / view.height)));
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cell * view.width + "px";
  canvas.style.height = cell * view.height + "px";
  canvas.width = cell * view.width * dpr;
  canvas.height = cell * view.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function draw(now) {
  requestAnimationFrame(draw);
  if (!view) return;
  const W = view.width, H = view.height, c = cell;
  const t = now / 1000;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = view.grid[y][x];
    ctx.fillStyle = (x + y) % 2 ? "#1a2b20" : "#1d3024";
    ctx.fillRect(x * c, y * c, c, c);
    if (ch === "#") {
      ctx.fillStyle = "#1f4a2a"; rr(x * c + 1, y * c + 1, c - 2, c - 2, c * 0.28); ctx.fill();
      ctx.fillStyle = "#2f6b3d"; rr(x * c + 2, y * c + 2, c - 5, c - 6, c * 0.25); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.beginPath(); ctx.arc(x * c + c * 0.35, y * c + c * 0.35, c * 0.14, 0, 7); ctx.fill();
    } else if (ch === "E") {
      drawGate(x, y, view.exitOpen, t);
    }
  }
  view.food.forEach(([x, y], i) => drawApple(x, y, t + i * 0.7));
  drawSnake(now);
  if (view.crash && (view.status === "crashed" || view.status === "game_over")) {
    const [x, y] = view.crash, pulse = 0.6 + 0.4 * Math.sin(t * 12);
    ctx.strokeStyle = `rgba(255,90,79,${pulse})`; ctx.lineWidth = Math.max(3, c * 0.16); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x * c + c * 0.2, y * c + c * 0.2); ctx.lineTo(x * c + c * 0.8, y * c + c * 0.8);
    ctx.moveTo(x * c + c * 0.8, y * c + c * 0.2); ctx.lineTo(x * c + c * 0.2, y * c + c * 0.8); ctx.stroke();
  }
  particles = particles.filter((p) => p.life > 0);
  particles.forEach((p) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.03;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  });
}
function drawGate(x, y, open, t) {
  const c = cell, cx = x * c + c / 2, cy = y * c + c / 2;
  if (open) {
    const glow = 0.5 + 0.5 * Math.sin(t * 5);
    ctx.fillStyle = `rgba(242,182,50,${0.25 + glow * 0.35})`;
    ctx.beginPath(); ctx.arc(cx, cy, c * 0.62, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2b632"; rr(x * c + c * 0.15, y * c + c * 0.12, c * 0.7, c * 0.78, c * 0.3); ctx.fill();
    ctx.fillStyle = "#0f1a14"; rr(x * c + c * 0.27, y * c + c * 0.26, c * 0.46, c * 0.64, c * 0.22); ctx.fill();
  } else {
    ctx.fillStyle = "#5c6a62"; rr(x * c + c * 0.12, y * c + c * 0.1, c * 0.76, c * 0.8, c * 0.12); ctx.fill();
    ctx.strokeStyle = "#2a332e"; ctx.lineWidth = Math.max(2, c * 0.08);
    for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(x * c + c * (0.12 + i * 0.19), y * c + c * 0.12); ctx.lineTo(x * c + c * (0.12 + i * 0.19), y * c + c * 0.88); ctx.stroke(); }
    ctx.fillStyle = "#f2b632"; ctx.beginPath(); ctx.arc(cx, cy + c * 0.05, c * 0.12, 0, 7); ctx.fill();
  }
}
function drawApple(x, y, t) {
  const c = cell, bob = Math.sin(t * 3) * c * 0.04;
  const cx = x * c + c / 2, cy = y * c + c / 2 + bob;
  ctx.fillStyle = "#e2483c"; ctx.beginPath(); ctx.arc(cx, cy + c * 0.04, c * 0.3, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(cx - c * 0.1, cy - c * 0.04, c * 0.08, 0, 7); ctx.fill();
  ctx.strokeStyle = "#6b3d1e"; ctx.lineWidth = Math.max(1.5, c * 0.06);
  ctx.beginPath(); ctx.moveTo(cx, cy - c * 0.22); ctx.lineTo(cx + c * 0.04, cy - c * 0.38); ctx.stroke();
  ctx.fillStyle = "#5fbf4a"; ctx.beginPath(); ctx.ellipse(cx + c * 0.13, cy - c * 0.32, c * 0.11, c * 0.06, -0.5, 0, 7); ctx.fill();
}
function snakePositions(now) {
  const cur = view.snake;
  if (!prevSnake || view.status !== "playing" || !running) return cur.map((p) => p.slice());
  const k = Math.min(1, (now - lastTick) / Math.max(60, view.speed));
  return cur.map((p, i) => {
    const q = prevSnake[Math.min(i, prevSnake.length - 1)];
    if (Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]) > 1) return p.slice();
    return [q[0] + (p[0] - q[0]) * k, q[1] + (p[1] - q[1]) * k];
  });
}
function drawSnake(now) {
  const c = cell, pts = snakePositions(now), n = pts.length;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = n - 1; i > 0; i--) {
    const a = pts[i], b = pts[i - 1];
    ctx.strokeStyle = i % 2 ? "#b49c22" : "#e8d24a";
    ctx.lineWidth = c * (0.62 - 0.18 * (i / n));
    ctx.beginPath(); ctx.moveTo(a[0] * c + c / 2, a[1] * c + c / 2); ctx.lineTo(b[0] * c + c / 2, b[1] * c + c / 2); ctx.stroke();
  }
  const [hx, hy] = pts[0], cx = hx * c + c / 2, cy = hy * c + c / 2;
  const [dx, dy] = DELTA[view.dir] || [1, 0];
  ctx.fillStyle = "#e8d24a"; ctx.beginPath(); ctx.arc(cx, cy, c * 0.4, 0, 7); ctx.fill();
  if (Math.floor(now / 400) % 3 === 0 && view.status === "playing") {
    ctx.strokeStyle = "#e2483c"; ctx.lineWidth = Math.max(1.5, c * 0.07);
    ctx.beginPath(); ctx.moveTo(cx + dx * c * 0.38, cy + dy * c * 0.38); ctx.lineTo(cx + dx * c * 0.62, cy + dy * c * 0.62); ctx.stroke();
  }
  const px = -dy, py = dx;
  [-1, 1].forEach((s) => {
    const ex = cx + dx * c * 0.12 + px * s * c * 0.17, ey = cy + dy * c * 0.12 + py * s * c * 0.17;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, c * 0.11, 0, 7); ctx.fill();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(ex + dx * c * 0.04, ey + dy * c * 0.04, c * 0.055, 0, 7); ctx.fill();
  });
  // Mr Snake's little top hat
  ctx.fillStyle = "#1b1b1b";
  const hatx = cx - dx * c * 0.08, haty = cy - dy * c * 0.08;
  ctx.save(); ctx.translate(hatx, haty); ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
  ctx.fillRect(-c * 0.2, c * 0.08, c * 0.4, c * 0.07); ctx.fillRect(-c * 0.12, c * 0.15, c * 0.24, c * 0.18);
  ctx.restore();
}
function burst(x, y, col, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 1 + Math.random() * 2.5;
    particles.push({ x: x * cell + cell / 2, y: y * cell + cell / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, r: 1.5 + Math.random() * 2.5, life: 1, col });
  }
}

/* ---------- HUD ---------- */
function hud() {
  $("lvl").textContent = `${view.level}/${view.levels}`;
  $("lvlname").textContent = view.name;
  $("score").textContent = view.score;
  $("lives").textContent = "♥".repeat(Math.max(0, view.lives)) || "–";
  $("food").textContent = view.exitOpen ? "Gate open! →" : `🍎 × ${view.food.length}`;
}
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
}
function renderHall(entries) {
  hallEntries = entries || hallEntries;
  const ol = $("hof");
  if (!hallEntries.length) { ol.innerHTML = '<li class="empty">No champions yet — be the first!</li>'; return; }
  ol.innerHTML = "";
  hallEntries.forEach((e, i) => {
    const li = document.createElement("li");
    if (myRank && i + 1 === myRank) li.className = "me";
    const d = e.date ? new Date(e.date * 1000).toLocaleDateString() : "";
    li.innerHTML = `<span class="r">${i + 1}.</span><span class="n"></span><span class="s">${e.score}</span><span class="lv">level ${e.level} · ${d}</span>`;
    li.querySelector(".n").textContent = e.name;
    ol.appendChild(li);
  });
}

/* ---------- overlays ---------- */
function card(html) { $("card").innerHTML = html; $("overlay").classList.remove("hidden"); }
function hideCard() { $("overlay").classList.add("hidden"); }
function showStart() {
  const touch = matchMedia("(pointer: coarse)").matches;
  card(`<h1>🐍 Fingertip Mr Snakes</h1>
    <p>Eat every 🍎 to unlock the gate.<br>Slither through it to reach the next maze.</p>
    <p>${touch ? "Swipe anywhere, or use the buttons below." : "Arrow keys or WASD to steer · Q / E to turn."}</p>
    <button class="go" id="startBtn">${touch ? "Tap to play" : "Press any arrow to play"}</button>`);
  $("startBtn").onclick = () => start();
}
function showEnd(won) {
  const last = localStorage.getItem("ftms_name") || "";
  card(`<h1>${won ? "🏆 You escaped the lair!" : "Game over"}</h1>
    <div class="big">${view.score}</div>
    <p>Reached level ${view.level} of ${view.levels}</p>
    <input id="nameIn" maxlength="16" placeholder="Your name for the hall of fame" value="">
    <div><button class="go" id="saveBtn">Save score</button><button class="go ghost" id="againBtn">Play again</button></div>`);
  const inp = $("nameIn"); inp.value = last; setTimeout(() => inp.focus(), 50);
  const save = async () => {
    const name = inp.value.trim() || "Anonymous";
    try { localStorage.setItem("ftms_name", name); } catch (e) { /* ignore */ }
    $("saveBtn").disabled = true;
    const r = await Backend.submit(name);
    myRank = r.rank || 0;
    if (r.entries) renderHall(r.entries);
    card(`<h1>${myRank ? "You're #" + myRank + "!" : "Saved"}</h1>
      <p>${myRank ? "Your name is in the hall of fame." : "Not quite top ten this time."}</p>
      <button class="go" id="againBtn2">Play again</button>`);
    $("againBtn2").onclick = () => start();
    if (matchMedia("(max-width: 820px), (pointer: coarse)").matches) $("side").classList.add("open");
  };
  $("saveBtn").onclick = save;
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); e.stopPropagation(); });
  $("againBtn").onclick = () => start();
}

/* ---------- game loop ---------- */
async function start() {
  clearTimeout(timer);
  $("side").classList.remove("open");
  myRank = 0; queue = []; paused = false; $("pauseBtn").textContent = "⏸";
  view = await Backend.newGame();
  prevSnake = null; resize(); hud(); hideCard();
  running = true; lastTick = performance.now();
  toast(`Level ${view.level}: ${view.name}`);
  schedule();
}
function schedule() {
  clearTimeout(timer);
  if (!running || paused) return;
  if (view.status === "game_over" || view.status === "won") { running = false; setTimeout(() => showEnd(view.status === "won"), 700); return; }
  timer = setTimeout(tick, view.status === "crashed" ? 1100 : view.speed);
}
async function tick() {
  if (!running || paused || busy) return;
  busy = true;
  const cmd = queue.shift() || "none";
  try {
    const before = view;
    const r = await Backend.step(cmd);
    prevSnake = before.level === r.state.level ? before.snake : null;
    view = r.state; lastTick = performance.now();
    if (before.width !== view.width || before.height !== view.height) resize();
    react(r.events, before);
  } catch (e) {
    running = false;
    card(`<h1>Lost the game</h1><p>${e.message}</p><button class="go" id="againBtn">New game</button>`);
    $("againBtn").onclick = () => start();
  }
  busy = false;
  hud();
  schedule();
}
function react(events, before) {
  events.forEach((ev) => { if (SFX[ev]) SFX[ev](); });
  const [hx, hy] = view.snake[0];
  if (events.includes("eat")) burst(hx, hy, "#e2483c");
  if (events.includes("exit_open")) toast("🔓 The gate is open!");
  if (events.includes("crash")) {
    canvas.classList.remove("shake"); void canvas.offsetWidth; canvas.classList.add("shake");
    if (view.status === "crashed") toast(`Ouch! ${view.lives} ${view.lives === 1 ? "life" : "lives"} left`);
    queue = [];
  }
  if (events.includes("level_up")) { toast(`Level ${view.level}: ${view.name}`); queue = []; }
  if (events.includes("win")) burst(hx, hy, "#f2b632", 60);
}
function push(cmd) {
  if (!running) { if ($("overlay").classList.contains("hidden") === false && !$("nameIn")) start(); return; }
  if (paused) { togglePause(); }
  const last = queue[queue.length - 1];
  if (cmd === last) return;
  if (queue.length < 3) queue.push(cmd);
}
function togglePause() {
  if (!running) return;
  paused = !paused;
  $("pauseBtn").textContent = paused ? "▶" : "⏸";
  if (paused) card(`<h1>Paused</h1><p>Press space or tap to carry on.</p><button class="go" id="resumeBtn">Resume</button>`), ($("resumeBtn").onclick = togglePause);
  else { hideCard(); lastTick = performance.now(); schedule(); }
}

/* ---------- input ---------- */
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  q: "turn_left", Q: "turn_left", z: "turn_left", Z: "turn_left", e: "turn_right", E: "turn_right", x: "turn_right", X: "turn_right" };
document.addEventListener("keydown", (e) => {
  if (e.target && e.target.tagName === "INPUT") return;
  if (KEYS[e.key]) { e.preventDefault(); push(KEYS[e.key]); }
  else if (e.key === " " || e.key === "p" || e.key === "P") { e.preventDefault(); running ? togglePause() : start(); }
  else if (e.key === "Enter" && !running && !$("nameIn")) start();
});
let touchStart = null;
$("stage").addEventListener("touchstart", (e) => { const t = e.touches[0]; touchStart = [t.clientX, t.clientY]; }, { passive: true });
$("stage").addEventListener("touchmove", (e) => {
  if (!touchStart) return;
  const t = e.touches[0], dx = t.clientX - touchStart[0], dy = t.clientY - touchStart[1];
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  push(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  touchStart = [t.clientX, t.clientY];
}, { passive: true });
$("stage").addEventListener("touchend", () => { touchStart = null; });
document.querySelectorAll("#pad button").forEach((b) => {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); push(b.dataset.cmd); });
});
$("pauseBtn").onclick = () => (running ? togglePause() : start());
$("soundBtn").onclick = () => { sound = !sound; $("soundBtn").textContent = sound ? "🔊" : "🔇"; };
$("hofBtn").onclick = () => $("side").classList.toggle("open");

/* ---------- boot ---------- */
(async function boot() {
  const entries = await Backend.init();
  renderHall(entries);
  $("mode").textContent = Backend.mode === "server" ? "Connected to the Prolog game server." : "Playing offline — scores are kept in this browser.";
  view = Engine.view(Engine.newGame());
  resize(); hud(); showStart();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
